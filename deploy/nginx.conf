# This file is included in nginx's http context through sites-enabled.
map $http_origin $resume_origin_allowed {
    default 0;
    "" 1;
    "https://www.youfangcv.site" 1;
    "https://youfangcv.site" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.youfangcv.site youfangcv.site;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.youfangcv.site$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.youfangcv.site youfangcv.site;
    ssl_certificate /etc/letsencrypt/live/youfangcv.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youfangcv.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YoufangTLS:10m;
    ssl_session_timeout 1d;

    root /opt/resume-youfang/current/www;
    index index.html;
    server_tokens off;
    access_log off;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=604800" always;

    # Public application shell; each business request requires the application's session.

    location /api/ {
        if ($resume_origin_allowed = 0) { return 403; }
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # These files are public, blank templates. Never place completed resumes here.
    location ^~ /static/resume-templates/ {
        auth_basic off;
        try_files $uri =404;
    }

    location ~ (^|/)\. {
        deny all;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
